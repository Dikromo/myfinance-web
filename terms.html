<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Syarat & Ketentuan — MyFinance</title>
<link rel="icon" type="image/png" href="logo.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

  :root{
    --bg:#0A1220;
    --bg-2:#0D1626;
    --surface:#131F35;
    --surface-2:#182A47;
    --line:#233350;
    --line-soft:#1B2A45;
    --text:#F1F5F9;
    --text-soft:rgba(226,232,240,0.62);
    --text-dim:rgba(226,232,240,0.42);
    --green:#05B35E;
    --green-bright:#12D67C;
    --green-tint:rgba(5,179,94,0.14);
    --red:#EF4444;
    --gold:#F0B429;
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Plus Jakarta Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    display:flex; flex-direction:column; min-height:100vh;
  }
  .wrap{max-width:1140px; margin:0 auto; padding:0 28px; width:100%;}
  a{color:inherit; text-decoration:none;}
  .mono{font-family:'IBM Plex Mono', monospace;}
  .disp{font-family:'Space Grotesk', sans-serif;}
  ::selection{background:var(--green); color:#fff;}

  /* ---------- NAV ---------- */
  header{
    position:sticky; top:0; z-index:50;
    background:rgba(10,18,32,0.85);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line-soft);
  }
  nav.wrap{
    display:flex; align-items:center; justify-content:space-between;
    height:78px;
  }
  .brand{display:flex; align-items:center; gap:11px;}
  .brand img{width:34px; height:34px; border-radius:9px;}
  .brand .mark{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:1.28rem; letter-spacing:-0.01em;}
  
  .nav-right{display:flex; align-items:center; gap:14px;}
  
  .lang-toggle{
    display:inline-flex; align-items:center; background:var(--surface); border:1px solid var(--line);
    border-radius:100px; padding:3px; gap:2px; font-size:0.78rem; font-weight:700; flex-shrink:0; white-space:nowrap;
  }
  .lang-btn{
    padding:4px 10px; border-radius:100px; cursor:pointer; transition:all .18s ease; color:var(--text-soft); border:none; background:none; white-space:nowrap; font-size:0.78rem; line-height:1.2;
  }
  .lang-btn.active{background:var(--green); color:#052312;}

  .btn{
    display:inline-flex; align-items:center; gap:8px;
    padding:10px 18px; border-radius:12px;
    font-weight:700; font-size:0.88rem;
    cursor:pointer; border:1px solid transparent; transition:transform .18s ease, background .18s ease, border-color .18s ease;
  }
  .btn:hover{transform:translateY(-2px);}
  .btn-ghost{border-color:var(--line); color:var(--text);}
  .btn-ghost:hover{border-color:var(--green); color:var(--green-bright);}

  /* ---------- MAIN CONTENT ---------- */
  main{flex:1; padding:60px 0 100px;}
  
  .sec-head{max-width:760px; margin-bottom:46px;}
  .sec-eyebrow{
    font-family:'IBM Plex Mono',monospace; font-size:0.72rem; letter-spacing:0.14em;
    text-transform:uppercase; color:var(--green-bright); font-weight:600; margin-bottom:14px;
    display:flex; align-items:center; gap:10px;
  }
  .sec-eyebrow::after{content:""; height:1px; width:40px; background:var(--line);}
  .sec-head h1{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:clamp(2rem,3.8vw,2.8rem); letter-spacing:-0.015em; line-height:1.15;}
  .sec-head p{margin-top:16px; color:var(--text-soft); font-size:1.02rem; line-height:1.65;}
  .policy-badge{display:inline-flex; align-items:center; gap:6px; font-size:0.8rem; color:var(--text-dim); margin-top:14px; font-family:'IBM Plex Mono',monospace;}

  .policy-grid{display:grid; grid-template-columns:1fr; gap:24px;}
  @media(min-width:860px){
    .policy-grid{grid-template-columns:repeat(2,1fr);}
    .policy-card.full-width{grid-column:span 2;}
  }
  .policy-card{
    background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:30px;
    transition:border-color .2s ease, transform .2s ease;
  }
  .policy-card:hover{border-color:rgba(5,179,94,0.4); transform:translateY(-3px);}
  .policy-num{
    font-family:'IBM Plex Mono',monospace; font-size:0.76rem; font-weight:600;
    color:var(--green-bright); background:var(--green-tint); border:1px solid rgba(5,179,94,0.3);
    padding:4px 12px; border-radius:100px; display:inline-block; margin-bottom:16px;
  }
  .policy-card h3{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:1.2rem; margin-bottom:16px; color:var(--text);}
  .policy-card ul{list-style:none; display:flex; flex-direction:column; gap:12px;}
  .policy-card li{font-size:0.9rem; color:var(--text-soft); line-height:1.65; position:relative; padding-left:20px;}
  .policy-card li::before{content:"•"; color:var(--green-bright); position:absolute; left:0; font-weight:bold; font-size:1.1rem;}

  /* ---------- FOOTER ---------- */
  footer{padding:46px 0 36px; border-top:1px solid var(--line-soft); background:var(--bg-2);}
  .foot-bottom{display:flex; flex-wrap:wrap; justify-content:space-between; gap:12px; font-size:0.78rem; color:var(--text-dim); font-family:'IBM Plex Mono',monospace;}

  @media (max-width: 600px) {
    .wrap { padding: 0 16px; }
    main { padding: 36px 0 60px; }
    nav.wrap { height: 64px; padding: 0 12px; }
    .brand { gap: 6px; }
    .brand img { width: 28px; height: 28px; }
    .brand .mark { font-size: 1.05rem; }
    .lang-toggle { padding: 2px; }
    .lang-btn { padding: 3px 7px; font-size: 0.72rem; }
    .nav-right { gap: 6px; }
    .btn { padding: 6px 10px; font-size: 0.78rem; }
    .policy-card { padding: 20px 16px; border-radius: 16px; }
  }

  @media (max-width: 500px) {
    .foot-bottom {
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 8px;
    }
  }
</style>
</head>
<body>

<header>
  <nav class="wrap">
    <a href="index.html" class="brand">
      <img src="logo.png" alt="Logo MyFinance">
      <span class="mark">MyFinance</span>
    </a>
    <div class="nav-right">
      <div class="lang-toggle">
        <button class="lang-btn active" onclick="setLang('id')">ID</button>
        <button class="lang-btn" onclick="setLang('en')">EN</button>
      </div>
      <a href="index.html" class="btn btn-ghost" id="backBtn">← Beranda</a>
    </div>
  </nav>
</header>

<main>
  <div class="wrap">
    <div class="sec-head">
      <div class="sec-eyebrow" id="eyebrowText">Aturan & Syarat Penggunaan</div>
      <h1 id="titleText">Syarat & Ketentuan</h1>
      <p id="descText">Harap baca Syarat dan Ketentuan berikut sebelum menggunakan aplikasi MyFinance dan fitur asisten Fina AI.</p>
      <div class="policy-badge" id="badgeText">Terakhir Diperbarui: 5 Agustus 2026</div>
    </div>

    <div class="policy-grid" id="policyGrid">
      <!-- Rendered via JS -->
    </div>
  </div>
</main>

<footer>
  <div class="wrap">
    <div class="foot-bottom">
      <span id="copyText">© 2026 MyFinance. Semua hak dilindungi.</span>
      <div>
        <a href="privacy-policy.html" style="margin-right:16px;" id="privacyLink">Kebijakan Privasi</a>
        <a href="index.html" id="homeLink">Beranda</a>
      </div>
    </div>
  </div>
</footer>

<script src="lang.js?v=1.3"></script>
<script>
  let currentLang = getCurrentLanguage();

  function setLang(lang) {
    currentLang = lang;
    setCurrentLanguage(lang);
    updateLangButtons(lang);
    updatePageText();
    renderGrid();
  }

  function updatePageText() {
    const termsDict = (typeof AppTranslations !== 'undefined' && AppTranslations.terms) ? AppTranslations.terms : {};
    const data = termsDict[currentLang] || termsDict['id'] || {};
    document.getElementById('pageTitle').innerText = (currentLang === 'id' ? 'Syarat & Ketentuan — MyFinance' : 'Terms & Conditions — MyFinance');
    if (data.eyebrow) document.getElementById('eyebrowText').innerText = data.eyebrow;
    if (data.title) document.getElementById('titleText').innerText = data.title;
    if (data.desc) document.getElementById('descText').innerText = data.desc;
    if (data.badge) document.getElementById('badgeText').innerText = data.badge;
    document.getElementById('backBtn').innerText = (currentLang === 'id' ? '← Beranda' : '← Home');
    document.getElementById('copyText').innerText = (currentLang === 'id' ? '© 2026 MyFinance. Semua hak dilindungi.' : '© 2026 MyFinance. All rights reserved.');
    if(document.getElementById('privacyLink')) document.getElementById('privacyLink').innerText = (currentLang === 'id' ? 'Kebijakan Privasi' : 'Privacy Policy');
    if(document.getElementById('homeLink')) document.getElementById('homeLink').innerText = (currentLang === 'id' ? 'Beranda' : 'Home');
  }

  function renderGrid() {
    const grid = document.getElementById('policyGrid');
    const termsDict = (typeof AppTranslations !== 'undefined' && AppTranslations.terms) ? AppTranslations.terms : {};
    const cards = (termsDict[currentLang] || termsDict['id'] || {}).cards || [];
    grid.innerHTML = cards.map(p => {
      const fullClass = p.fullWidth ? 'full-width' : '';
      return `
        <div class="policy-card ${fullClass}">
          <span class="policy-num">${p.num}</span>
          <h3>${p.title}</h3>
          <ul>
            ${p.items.map(it => `<li>${it}</li>`).join('')}
          </ul>
        </div>`;
    }).join('');
  }

  setLang(currentLang);
</script>

</body>
</html>
